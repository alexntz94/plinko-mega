# Behind a Google Cloud HTTPS load balancer every connection comes from the balancer. It appends
# "<visitor>, <balancer>" to X-Forwarded-For, so the visitor is the second entry from the right; anything further
# left was written by the client and is ignored, so it can't be faked to dodge the limits.
map $http_x_forwarded_for $client_key {
    "~(?<visitor>[0-9A-Fa-f:.]+)\s*,\s*[^,]+$" $visitor;
    default $binary_remote_addr;
}
# the same address as text, for the access log (check it shows your own IP after deploying)
map $http_x_forwarded_for $client_addr {
    "~(?<visitor>[0-9A-Fa-f:.]+)\s*,\s*[^,]+$" $visitor;
    default $remote_addr;
}
