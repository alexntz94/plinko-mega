<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in · Plinko Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/admin-assets/logo.svg}">
    <link rel="stylesheet" th:href="@{/admin-assets/admin.css}">
</head>
<body class="auth">
<main class="auth-panel">
    <div class="auth-brand"><img class="brand-mark" src="/admin-assets/logo.svg" alt="" width="28" height="28">Plinko Admin</div>
    <h1>Sign in</h1>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>
    <div class="flash ok" th:if="${param.logout}">You signed out.</div>
    <div class="flash ok" th:if="${param.enrolled}">Authenticator set up. Sign in again, then enter the next code from your app.</div>
    <div class="flash ok" th:if="${param.passwordChanged}">Password changed. Sign in with your new password.</div>
    <div class="flash error" th:if="${param.expired}">You were signed out (30 minutes without activity, or a change to your account). Sign in again.</div>
    <form th:action="@{/admin/login}" method="post" autocomplete="on">
        <label>Username <input name="username" required autofocus maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
        <label>Password <input name="password" type="password" required maxlength="200" autocomplete="current-password"></label>
        <button class="block" type="submit">Continue</button>
    </form>
    <p class="auth-foot"><a th:href="@{/admin/forgot}">Forgot password?</a></p>
</main>
</body>
</html>
