<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Plinko">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".14"/>
  <!-- pegs: a small plinko pyramid -->
  <g fill="#ffffff">
    <circle cx="32" cy="30" r="4"/>
    <circle cx="22" cy="41" r="4"/><circle cx="42" cy="41" r="4"/>
    <circle cx="12" cy="52" r="4"/><circle cx="32" cy="52" r="4"/><circle cx="52" cy="52" r="4"/>
  </g>
  <!-- the ball dropping in -->
  <circle cx="32" cy="15" r="8" fill="url(#ball)"/>
</svg>
