# Behind a Cloudflare Tunnel (the demo): every connection comes from the tunnel container. Cloudflare sets
# CF-Connecting-IP to the visitor's address itself (a client can't choose it), and nginx is not reachable any other
# way: its port is bound to 127.0.0.1 on the demo server.
map $http_cf_connecting_ip $client_key {
    "~^[0-9A-Fa-f:.]+$" $http_cf_connecting_ip;
    default $binary_remote_addr;
}
# the same address as text, for the access log
map $http_cf_connecting_ip $client_addr {
    "~^[0-9A-Fa-f:.]+$" $http_cf_connecting_ip;
    default $remote_addr;
}
