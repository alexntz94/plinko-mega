# Public entry point: serves the game and proxies only the game API. The admin panel is not reachable here.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Paths only: query strings (the launch token) never reach the logs.
    # $client_addr: the visitor (client-ip.conf), not the proxy in front
    log_format noquery '$client_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent" req=$request_id';
    access_log /dev/stdout noquery;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # $client_key: the visitor's address (client-ip.conf, chosen when the image is built)
    include /etc/nginx/client-ip.conf;
    limit_req_zone $client_key zone=api:10m rate=10r/s;
    # the public demo: a new wallet at most every 10 seconds per visitor (404 unless the backend runs DEMO_MODE)
    limit_req_zone $client_key zone=demo:10m rate=6r/m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn_zone $client_key zone=perip:10m;

    # Compression for text (review 4.3, N7): scripts, styles, JSON, SVG. Images, video and woff2 are compressed already.
    # gzip_proxied is about the REQUEST: with its default (off) nginx skips every request that came through a proxy
    # (a Via header), and Google's load balancer adds "Via: 1.1 google", so on Google Cloud nothing was compressed.
    # "any" compresses those too. Answers from the backend are not compressed at all (gzip off in proxy.conf, so in
    # every /api and /demo location): they carry the session id, and compressing a secret next to text the visitor
    # chose can leak it (BREACH); they are small JSON, so little is lost.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Theme files and sounds (review 4.2, N12): the game asks for them with ?v=<fingerprint of that theme's files>, a
    # new address whenever one changes, so those addresses are kept for a year by browsers and the CDN ("public":
    # Cloud CDN may store it; "immutable": no re-check on reload); without ?v they are re-checked every time.
    # Review R5: only a file that is there (200, 206, 304) is kept; an error (a 404 during a deploy or for a removed
    # file, a 429 from the limits) is never stored, so a missing picture isn't kept for a year under its ?v.
    map "$status:$arg_v" $asset_cache_control {
        "~^(200|206|304):.+$" "public, max-age=31536000, immutable";
        "~^(200|206|304):$"   "no-cache";
        default               "no-store";
    }

    # The same for Vite's hashed scripts and styles: a year when found, never stored when not.
    map $status $hashed_cache_control {
        "~^(200|206|304)$" "public, max-age=31536000, immutable";
        default            "no-store";
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        limit_conn perip 50;

        include /etc/nginx/security-headers.conf;

        location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

        # Each location forwards to its one fixed backend path, never the client's raw URL.
        location = /api/game/session { limit_req zone=api burst=5 nodelay; limit_except POST { deny all; } proxy_pass http://backend/api/game/session; include /etc/nginx/proxy.conf; }
        location = /api/game/resume  { limit_req zone=api burst=5 nodelay; limit_except POST { deny all; } proxy_pass http://backend/api/game/resume; include /etc/nginx/proxy.conf; }
        location = /api/game/play    { limit_req zone=api burst=10 nodelay; limit_except POST { deny all; } proxy_pass http://backend/api/game/play; include /etc/nginx/proxy.conf; }
        location = /api/game/history { limit_req zone=api burst=5 nodelay; limit_except POST { deny all; } proxy_pass http://backend/api/game/history; include /etc/nginx/proxy.conf; }
        # review 7.4: the game reports that a reality check or the session clock was shown, and that the player went on
        location = /api/game/event   { limit_req zone=api burst=5 nodelay; limit_except POST { deny all; } proxy_pass http://backend/api/game/event; include /etc/nginx/proxy.conf; }

        # the public demo (404 unless the backend runs DEMO_MODE): the lobby, and play, which makes a wallet
        location = /demo      { limit_req zone=api burst=10 nodelay; limit_except GET { deny all; } proxy_pass http://backend/api/demo; include /etc/nginx/proxy.conf; include /etc/nginx/base-headers.conf; }
        # GET (an old link, a link previewer): back to the lobby, no wallet; POST (the Play button): a wallet (review 2.5)
        location = /demo/play { limit_req zone=demo burst=3 nodelay; limit_except GET POST { deny all; } proxy_pass http://backend/api/demo/play; include /etc/nginx/proxy.conf; include /etc/nginx/base-headers.conf; }

        # Everything else on the backend (admin panel, mock PAM, actuator) is not public.
        location /api/ { return 404; }
        location /admin { return 404; }
        location /mock-pam { return 404; }
        location /actuator { return 404; }
        location ~ /\. { return 404; }

        # Scripts and styles built by Vite: the file name carries a hash of the content, so it never changes (review 4.2).
        location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
            limit_except GET { deny all; }
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control $hashed_cache_control always;
            try_files $uri =404;
        }

        # Theme files (images, video, fonts) and sounds: kept for a year when asked for with their version.
        # add_header here replaces the server-level headers, so the security headers are included again.
        location ~ ^/(themes|assets/sounds)/ {
            limit_except GET { deny all; }
            location ~ /theme\.json$ {
                limit_except GET { deny all; }
                include /etc/nginx/security-headers.conf;
                add_header Cache-Control "no-cache" always;
                try_files $uri =404;
            }
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control $asset_cache_control always;
            try_files $uri =404;
        }

        # The page itself is never stored anywhere (browser or CDN): a launch link carries the player's one-time token.
        location = /index.html {
            limit_except GET { deny all; }
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location / {
            limit_except GET { deny all; }
            # Browsers re-check every file (ETag, cheap 304) so a deploy never mixes old and new scripts.
            # "expires" rather than add_header keeps the server-level security headers.
            expires -1;
            try_files $uri $uri/ =404;
        }
    }
}
