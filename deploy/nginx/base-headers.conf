# The security headers of every answer except the page's CSP (security-headers.conf adds the game's). The demo lobby
# takes only these: the backend sends its own CSP for it, and a second one would add form-action 'none' and stop Play.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Enable once served over HTTPS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
