<!DOCTYPE html>
<html th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Audit log · Plinko Admin</title></head>
<body>
<section>
    <div class="page-head">
        <div>
            <h1>Audit log</h1>
            <p>Every admin action, in order. Each entry is chained to the one before it, so a changed or deleted entry is detected.</p>
        </div>
        <div class="page-actions"><a class="button secondary" th:href="${links.csv()}">Export CSV</a></div>
    </div>

    <div class="flash" th:classappend="${chain.intact()} ? 'ok' : 'error'"
         th:text="${chain.intact()} ? |Hash chain intact (${chain.entries()} entries checked).| : |Hash chain BROKEN at entry #${chain.brokenAtId()}: the log was changed or entries were deleted.|"></div>

    <form class="filters" method="get" th:action="@{/admin/audit}" data-autosubmit>
        <input type="search" name="q" th:value="${filter.q()}" placeholder="Search details" maxlength="128" aria-label="Search details">
        <select name="user" aria-label="Admin">
            <option value="">All admins</option>
            <option th:each="u : ${auditUsers}" th:value="${u}" th:text="${u}" th:selected="${u == filter.username()}">admin</option>
        </select>
        <select name="action" aria-label="Action">
            <option value="">All actions</option>
            <option th:each="a : ${actions}" th:value="${a}" th:text="${a}" th:selected="${a == filter.action()}">LOGIN</option>
        </select>
        <span class="date-range"><span>From</span><input type="date" name="from" th:value="${filter.from()}" aria-label="From date"><span class="dash">–</span><input type="date" name="to" th:value="${filter.to()}" aria-label="To date"></span>
        <span class="spacer"></span>
        <a class="clear" th:if="${links.filtered()}" th:href="@{/admin/audit}">Clear filters</a>
    </form>

    <div class="table-wrap">
        <table>
            <thead><tr>
                <th:block th:replace="~{admin/fragments :: sort(${links}, 'time', '#', 'num')}"></th:block>
                <th>Time (UTC)</th><th>Admin</th><th>Action</th><th>Details</th>
            </tr></thead>
            <tbody>
            <tr th:each="e : ${result.items()}">
                <td class="num muted" th:text="${e.id()}"></td>
                <td class="nowrap" th:text="${#temporals.format(e.createdAt(), 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${e.username()}"></td>
                <td><code th:text="${e.action()}"></code></td>
                <td class="small wrap" th:text="${e.details() ?: ''}"></td>
            </tr>
            <tr th:if="${result.items().isEmpty()}"><td colspan="5" class="empty">No entries match these filters.</td></tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{admin/fragments :: pager(${result}, ${links})}"></div>
</section>
</body>
</html>
