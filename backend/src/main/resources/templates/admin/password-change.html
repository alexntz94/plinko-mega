<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Choose a new password · Plinko Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/admin-assets/logo.svg}">
    <link rel="stylesheet" th:href="@{/admin-assets/admin.css}">
</head>
<body class="auth">
<form class="auth-panel" th:action="@{/admin/password/change}" method="post" autocomplete="off">
    <div class="auth-brand"><img class="brand-mark" src="/admin-assets/logo.svg" alt="" width="28" height="28">Plinko Admin</div>
    <h1>Choose a new password</h1>
    <p>You signed in with a temporary password. Choose your own before you continue.</p>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>
    <label>Temporary password <input name="currentPassword" type="password" required maxlength="200" autocomplete="current-password"></label>
    <label>New password <input name="newPassword" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label>
    <label>New password again <input name="confirmPassword" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label>
    <p class="muted small">At least 12 characters, mixing 3 of: lowercase, uppercase, digits, symbols.</p>
    <button class="block" type="submit">Save and sign in again</button>
</form>
</body>
</html>
